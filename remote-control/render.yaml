services:
  - type: web
    name: neon-owner-remote
    runtime: docker
    rootDir: remote-control
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NEON_REMOTE_BRIDGE_KEY
        generateValue: true
      - key: NEON_REMOTE_STORE
        value: /data/neon-remote.json
    disk:
      name: remote-devices
      mountPath: /data
      sizeGB: 1
