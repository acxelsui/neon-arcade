    // This release has exactly three chunks per file. A failed probe must not
    // fall back to a whole .wasm/.data URL: those files do not exist upstream.
    const PART_SIZES = {

      "ab8dd356a41a2943639294657a0990f8.data": [20866662,20866662,16876640]
    };
    async function mergeParts(baseUrl) {
      const file = baseUrl.split("/").pop();
      const buffers = await Promise.all(PART_SIZES[file].map(async (size,index) => {
        const url = new URL(baseUrl + ".part" + (index+1), document.baseURI).href;
        for (let attempt=0; attempt<3; attempt++) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Game download returned " + response.status);
            const bytes = new Uint8Array(await response.arrayBuffer());
            if (bytes.length !== size) throw new Error("Game download was interrupted.");
            return bytes;
          } catch (error) {
            if (attempt === 2) throw error;
            await new Promise(resolve => setTimeout(resolve,400*(attempt+1)));
          }
        }
      }));
      const merged = new Uint8Array(buffers.reduce((total,part) => total+part.length,0));
      let offset=0;
      for (const part of buffers) { merged.set(part,offset); offset+=part.length; }
      if (file.endsWith(".wasm") && ![0,97,115,109].every((byte,index) => merged[index] === byte))
        throw new Error("The game engine download is invalid.");
      return URL.createObjectURL(new Blob([merged], {type:file.endsWith(".wasm")?"application/wasm":"application/octet-stream"}));
    }

    function showLoadError() {
      const loadingText = document.getElementById("loading-text");
      loadingText.style.display = "block";
      loadingText.textContent = "The game download was interrupted. ";
      const retry = document.createElement("button");
      retry.textContent = "Try again";
      retry.onclick = () => location.reload();
      loadingText.appendChild(retry);
    }

    async function preMergeAll() {
      const map = {};
      const files = Object.entries(SPLIT_MAP);
      const total = files.length;
      let done = 0;

      const loadingText = document.getElementById("loading-text");

      for (const [file, _] of files) {
        const merged = await mergeParts("Build/" + file);
        map[file] = merged;
        done++;
        const percent = Math.floor((done / total) * 100);
        loadingText.innerText = `LOADING... ${percent}%`;
        console.log("Premerged:", file, "→", merged);
      }

      loadingText.innerText = "Starting BuildNow.gg…";

      return map;
    }

    (async () => {
      const mergedMap = await preMergeAll();
      window.SPLIT_MAP = mergedMap;
      const origFetch = window.fetch;
      window.fetch = async function(resource, options) {
        if (typeof resource === "string") {
          const key = resource.split("/").pop();
          if (mergedMap[key]) {

            return origFetch(mergedMap[key], options);

            origOpen.call(xhr, method, mergedMap[key], ...rest);

        return xhr;

        streamingAssetsUrl: "StreamingAssets",
        companyName: "BuildNow GG",
        productName: "BuildNow GG",
        productVersion: "1.0.0"
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = showLoadError;
